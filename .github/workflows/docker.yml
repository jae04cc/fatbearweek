name: Build & Push to Docker Hub

on:
  push:
    branches: [main]

jobs:
  # Gate: the bracket topology/scoring unit tests must pass before anything is
  # built or pushed. A regression in the math stops the deploy instead of
  # shipping a broken leaderboard.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            jae04cc/fatbearweek:latest
            jae04cc/fatbearweek:${{ github.sha }}
