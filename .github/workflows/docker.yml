name: Docker

# Publishes to GitHub Container Registry: ghcr.io/jae04cc/fatbearweek
#
# No secrets to configure — authentication uses the GITHUB_TOKEN that every
# workflow run is issued automatically. That's the whole reason this targets
# ghcr rather than Docker Hub: personal GitHub accounts have no shared secret
# store, so a Docker Hub token would have to be re-added to every repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate: the bracket topology/scoring unit tests must pass before anything is
  # built or pushed. A regression in the math stops the deploy instead of
  # shipping a broken leaderboard.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest

    # GITHUB_TOKEN is read-only by default; publishing a package needs this.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr requires a lowercase image path, and github.repository preserves
      # the owner's original casing.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
